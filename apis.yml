name: Savedo
description: Savedo was a German fintech operating a consumer deposit marketplace that let savers in Germany
  open fixed-term and savings accounts across multiple European partner banks from a single portal. Backed
  by Point Nine, it was acquired by Deposit Solutions in 2017 and is now a subsidiary brand of Raisin SE
  (WeltSparen). The Savedo customer portal was deactivated on 31 March 2022 and the brand no longer accepts
  new customers; existing balances are administered via flatexDEGIRO Bank AG. Savedo published no public API,
  developer portal, or SDKs. This profile is retained as a network lead surfaced from the Point Nine portfolio.
